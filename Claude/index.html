<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#111111">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Арканоид — p5.js</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; background: #111; height: 100%; }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100dvh;
    }
    /* Платформу ведут пальцем по всей странице, поэтому жесты нигде не должны
       скроллить, тянуть и выделять — иначе браузер отменяет ведение (pointercancel) */
    html, body, canvas {
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    /* Размеры холста подгоняет fitCanvas() в sketch.js */
    canvas { display: block; }
  </style>
</head>
<body>
  <script src="music.js"></script>
  <script src="sfx.js"></script>
  <script src="touch.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
